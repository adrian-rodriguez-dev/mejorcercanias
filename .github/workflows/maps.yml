name: Review official maps
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Download the current official maps and GTFS
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "tools/maps/**"
      - "data/maps/**"
      - ".github/workflows/maps.yml"
permissions:
  contents: read
concurrency:
  group: map-evidence
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/maps/requirements.txt
      - run: python -m pip install -r tools/maps/requirements.txt
      - run: python -m unittest discover -s tools/maps -p 'test_*.py'
      - name: Extract and validate evidence
        env:
          REFRESH: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.refresh }}
        run: |
          args=()
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python tools/maps/run.py --output work/maps "${args[@]}"
      - name: Retain evidence and review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-evidence-${{ github.run_id }}
          path: work/maps
          retention-days: 30
          if-no-files-found: warn
      - name: Publish execution summary
        if: always()
        run: |
          if [ -f work/maps/SUMMARY.md ]; then cat work/maps/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
